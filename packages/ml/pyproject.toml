[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigsense-ml"
version = "0.1.0"
description = "SigSense ML: spectrogram preprocessing, embedding CNN, and training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pillow",
  "torch",
  "torchvision",
  "faiss-cpu",
  "h5py",
]

[project.optional-dependencies]
dev = ["pytest"]
ble = ["cryptography>=43"]
torchsig = ["torchsig>=2.2"]
all = ["torchsig>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sigsense_ml*"]
